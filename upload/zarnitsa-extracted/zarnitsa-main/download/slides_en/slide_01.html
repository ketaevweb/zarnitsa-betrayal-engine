<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZARNITSA · publisher pitch — cover</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>html,body{width:1280px;height:720px;overflow:hidden;}</style>
</head>
<body>
<div class="slide">
  <!-- full-slide title art -->
  <img src="art_title.png" alt="ZARNITSA title art" style="position:absolute;inset:0;width:1280px;height:720px;object-fit:cover;object-position:center;">
  <!-- bottom and left darkening for text contrast -->
  <div class="scrim-b" data-decor aria-hidden="true" style="position:absolute;inset:0;"></div>
  <div data-decor aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(100deg, rgba(19,17,17,0.85) 0%, rgba(19,17,17,0.50) 38%, rgba(19,17,17,0) 68%);"></div>

  <!-- content: bottom-left corner -->
  <div style="position:absolute;left:72px;bottom:60px;max-width:790px;z-index:5;">
    <div style="font-family:var(--font-body);font-size:var(--fs-small);font-weight:600;letter-spacing:0.3em;color:var(--gold);">PUBLISHER PITCH · 2026</div>
    <h1 style="font-family:var(--font-heading);font-size:112px;font-weight:800;letter-spacing:0.06em;line-height:1;color:var(--primary);margin:16px 0 0;text-shadow:0 4px 34px rgba(0,0,0,0.5);">ZARNITSA</h1>
    <p style="font-family:var(--font-heading);font-style:italic;font-size:21px;line-height:1.45;color:rgba(232,223,200,0.9);margin:20px 0 0;max-width:620px;">&ldquo;The oath binds the vataga. The vataga holds the world. Betray the oath — and the world falls first.&rdquo;</p>
    <div class="rule-gold" style="width:520px;margin:24px 0 16px;"></div>
    <div style="font-family:var(--font-body);font-size:var(--fs-small);color:var(--muted);letter-spacing:0.03em;">Narrative action-RPG · Single-player + co-op 2–4 · PC / next-gen consoles / cloud · Release 2031</div>
  </div>

  <div style="position:absolute;right:72px;bottom:26px;z-index:5;font-family:var(--font-body);font-size:var(--fs-micro);color:var(--muted);letter-spacing:0.12em;">Vataga Games</div>
</div>
</body>
</html>
